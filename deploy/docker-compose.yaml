name: aicodex-agent-teams-volumes

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    extends:
      file: config.yaml
      service: postgres-credentials
    image: postgres:18-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
    restart: unless-stopped
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    environment:
      TZ: UTC
      POSTGRES_DB: ${AICODEX_AGENT_TEAMS_DATABASE_NAME:-aicodex_agent_teams}
      POSTGRES_USER: ${AICODEX_AGENT_TEAMS_DATABASE_USER:-aicodex_agent_teams}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - type: volume
        source: postgres
        target: /var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  redis:
    extends:
      file: config.yaml
      service: redis-credentials
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    restart: unless-stopped
    volumes:
      - type: volume
        source: redis
        target: /data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  aicodex-agent-teams:
    extends:
      file: config.yaml
      service: app-runtime
    image: ${AICODEX_AGENT_TEAMS_IMAGE:-ghcr.io/aicodex-org/aicodex-agent-teams:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
      args:
        AICODEX_AGENT_TEAMS_VERSION: ${AICODEX_AGENT_TEAMS_VERSION:-}
        AICODEX_AGENT_TEAMS_GIT_SHA: ${AICODEX_AGENT_TEAMS_GIT_SHA:-unknown}
        AICODEX_AGENT_TEAMS_BUILD_TIME: ${AICODEX_AGENT_TEAMS_BUILD_TIME:-unknown}
        AICODEX_AGENT_TEAMS_BUILD_TYPE: ${AICODEX_AGENT_TEAMS_BUILD_TYPE:-release}
    restart: unless-stopped
    user: '10001:10001'
    init: true
    # 不等待存量会话；宽限期需覆盖后台收尾（默认 30s）及进程清理余量
    stop_grace_period: 75s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    pids_limit: 256
    ports:
      - '127.0.0.1:9699:9699'
    volumes:
      - type: volume
        source: data
        target: /app/.runtime/data
      - type: volume
        source: logs
        target: /app/.runtime/logs
    configs:
      - source: aicodex_agent_teams_config
        target: /app/deploy/config.yaml
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9699/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次升级需回填历史请求，宽限期只容忍启动失败，探测成功后立即转为健康
      start_period: 5m
    environment:
      HOME: /app
      AICODEX_AGENT_TEAMS_SERVER_HOST: 0.0.0.0
      AICODEX_AGENT_TEAMS_SERVER_PORT: '9699'
      AICODEX_AGENT_TEAMS_DATABASE_URL: postgres://${AICODEX_AGENT_TEAMS_DATABASE_USER:-aicodex_agent_teams}@postgres:5432/${AICODEX_AGENT_TEAMS_DATABASE_NAME:-aicodex_agent_teams}
      AICODEX_AGENT_TEAMS_REDIS_URL: redis://redis:6379/
      AICODEX_AGENT_TEAMS_DEPLOYMENT_MODE: docker
      AICODEX_AGENT_TEAMS_UPDATE_REPOSITORY: aicodex-org/AICodexAgentTeams
      AICODEX_AGENT_TEAMS_GITHUB_API_BASE: https://api.github.com/repos
      AICODEX_AGENT_TEAMS_UPDATE_EXE_PATH: /app/bin/AICodexAgentTeams
      AICODEX_AGENT_TEAMS_WEB_DIST_DIR: /app/web/dist
      AICODEX_AGENT_TEAMS_ENABLE_SELF_RESTART: 'true'
    logging: *json-logging

configs:
  aicodex_agent_teams_config:
    file: ./config.yaml

volumes:
  postgres:
  redis:
  data:
  logs:
